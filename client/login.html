<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Patient Records</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card" style="max-width:420px;margin:48px auto;">
      <h2 class="title">Hospital Staff Login</h2>
      <p class="muted">Sign in with your staff account.</p>
      <form id="login-form">
        <div style="margin-top:12px">
          <input id="email" type="text" placeholder="Email" required style="width:100%">
        </div>
        <div style="margin-top:8px">
          <input id="password" type="password" placeholder="Password" required style="width:100%">
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" type="submit">Sign in</button>
        </div>
      </form>
      <p class="muted" style="margin-top:12px">Don't share credentials. For demo only.</p>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
