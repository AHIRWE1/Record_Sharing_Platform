<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register Patient</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card" style="max-width:640px;margin:32px auto;">
      <h2 class="title">Register New Patient</h2>
      <form id="register-form">
        <div style="margin-bottom:8px"><input id="name" type="text" placeholder="Full name" required style="width:100%"></div>
        <div style="margin-bottom:8px"><input id="dob" type="date" placeholder="Date of birth" style="width:100%"></div>
        <div style="margin-bottom:8px"><input id="gender" type="text" placeholder="Gender" style="width:100%"></div>
        <div style="margin-bottom:8px"><input id="national_id" type="text" placeholder="National ID" style="width:100%"></div>
        <div style="text-align:right"><button class="btn" type="submit">Register</button></div>
      </form>
    </div>
  </div>
  <script src="js/registerPatient.js"></script>
</body>
</html>
